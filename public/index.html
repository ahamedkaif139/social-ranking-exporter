<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Ranking Exporter</title><style>body{font-family:system-ui;margin:0;background:#f4f6f9;color:#172033}header{background:#111827;color:white;padding:18px}main{max-width:1100px;margin:auto;padding:14px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:14px}input,select,button{font:inherit;padding:11px;border-radius:10px}input,select{width:100%;border:1px solid #ccd2da}button{border:0;font-weight:700}.primary{background:#2563eb;color:white}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.buttons{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.progress{height:10px;background:#e5e7eb;border-radius:9px}.bar{height:100%;width:0;background:#2563eb}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}.stat{background:#f7f8fa;padding:12px;border-radius:12px}.stat b{display:block;font-size:18px}.status{white-space:pre-wrap;background:#f7f8fa;padding:12px;border-radius:10px;font-size:13px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.table{overflow:auto;max-height:600px}@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><h2>Social Ranking Exporter</h2><div>Cloudflare Worker • numeric export</div></header><main><section class="card"><h3>Source</h3><input id="url" value="https://socialcounts.org/top/channels?limit=100&page=1"><div class="grid" style="margin-top:10px"><div><small>Pages</small><input id="pages" type="number" value="1" min="1" max="1000"></div><div><small>Rows/page</small><input id="limit" type="number" value="100" min="1" max="100"></div><div><small>Delay ms</small><input id="delay" type="number" value="2000" min="1000"></div></div><div class="buttons"><button class="primary" id="start">Start
